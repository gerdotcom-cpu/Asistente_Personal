<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Personal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    #chat {
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .mensaje {
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 12px;
      line-height: 1.4;
    }

    .usuario {
      background: #e9eef8;
      margin-left: 60px;
    }

    .sol {
      background: #f1f1f1;
      margin-right: 60px;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
    }

    #microfono {
      font-size: 22px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Asistente Personal</h1>

  <div id="chat">
    <div class="mensaje sol">
      Hola, ¿en qué puedo ayudarte hoy?
    </div>
  </div>

  <div class="entrada">
    <input
      id="texto"
      type="text"
      placeholder="Escribí o hablá..."
      autocomplete="off"
    >

    <button id="microfono">🎤</button>
    <button id="enviar">Enviar</button>
  </div>

</div>

<script>

const WEBHOOK =
"https://gerardopustelnik.app.n8n.cloud/webhook/ad15c930-460c-4fca-a7bf-14d9774e4105/chat";

const texto = document.getElementById("texto");
const chat = document.getElementById("chat");
const botonMicrofono = document.getElementById("microfono");

const sessionId =
  localStorage.getItem("sessionId") ||
  crypto.randomUUID();

localStorage.setItem("sessionId", sessionId);


function agregarMensaje(mensaje, clase) {

  const div = document.createElement("div");

  div.className = "mensaje " + clase;

  div.textContent = mensaje;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


function hablar(mensaje) {

  window.speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(mensaje);

  voz.lang = "es-MX";

  window.speechSynthesis.speak(voz);
}


async function enviarMensaje() {

  const mensaje = texto.value.trim();

  if (!mensaje) return;

  agregarMensaje(mensaje, "usuario");

  texto.value = "";

  try {

    const respuesta = await fetch(WEBHOOK, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        action: "sendMessage",
        sessionId: sessionId,
        chatInput: mensaje
      })

    });


    const data = await respuesta.json();

    let respuestaSol = "";

    if (data.output) {

      respuestaSol = data.output;

    } else if (data.text) {

      respuestaSol = data.text;

    } else if (Array.isArray(data) && data[0]?.output) {

      respuestaSol = data[0].output;

    } else {

      respuestaSol = JSON.stringify(data);

    }


    agregarMensaje(respuestaSol, "sol");

    hablar(respuestaSol);

  }

  catch (error) {

    agregarMensaje(
      "No pude comunicarme con n8n.",
      "sol"
    );

    console.error(error);
  }
}


document
  .getElementById("enviar")
  .addEventListener("click", enviarMensaje);


texto.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    enviarMensaje();

  }

});


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  const recognition =
    new SpeechRecognition();

  recognition.lang = "es-MX";

  recognition.continuous = false;

  recognition.interimResults = false;


  botonMicrofono.onclick = function() {

    recognition.start();

    botonMicrofono.textContent = "🔴";

  };


  recognition.onresult = function(event) {

    texto.value =
      event.results[0][0].transcript;

  };


  recognition.onend = function() {

    botonMicrofono.textContent = "🎤";

  };

}

else {

  botonMicrofono.disabled = true;

  botonMicrofono.title =
    "Este navegador no soporta reconocimiento de voz";

}

</script>

</body>
</html>
