<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singularity</title>

<link
  href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
  rel="stylesheet"
/>

<style>

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f3;
  color: #171717;
}

.app {
  display: grid;
  grid-template-columns: 118px minmax(0, 1fr) 360px;
  gap: 18px;
  width: 100vw;
  height: 100vh;
  padding: 18px;
}

/* SIDEBAR */

.sidebar {
  height: calc(100vh - 36px);
  border-radius: 34px;

  background:
    radial-gradient(circle at 50% 0%, rgba(190,150,72,.14), transparent 22%),
    linear-gradient(180deg, #11181b 0%, #081319 100%);

  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 24px 10px 20px;

  overflow: hidden;

  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

.logo {
  width: 58px;
  height: 58px;

  border: 1px solid #b9944f;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #d7b56d;

  font-size: 24px;

  margin-bottom: 10px;

  box-shadow: 0 0 22px rgba(185,148,79,.16);
}

.logo-title {
  font-size: 9px;
  letter-spacing: 1.8px;
  color: #d3b36f;
  margin-bottom: 28px;
  text-align: center;
}

.nav {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

.nav-item {
  width: 72px;
  height: 64px;

  border-radius: 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;

  color: white;

  opacity: .88;
}

.nav-item.active {
  background: rgba(255,255,255,.07);
  border-left: 3px solid #c69d52;
  color: #d6b268;
}

.nav-item:hover {
  background: rgba(255,255,255,.05);
}

.sidebar-bottom {
  margin-top: auto;
  width: 100%;
  padding-top: 18px;

  border-top: 1px solid rgba(255,255,255,.08);

  display: flex;
  justify-content: center;
}

.online-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #58cc66;
}

/* CENTRO */

.center {
  min-width: 0;
  min-height: 0;
  height: calc(100vh - 36px);
}

.chat-card {
  width: 100%;
  height: 100%;

  background: white;

  border: 1px solid #e4e4e0;
  border-radius: 28px;

  overflow: hidden;

  position: relative;

  box-shadow: 0 8px 30px rgba(0,0,0,.035);
}

.chat-brand {
  position: absolute;

  top: 24px;
  left: 30px;

  z-index: 30;

  font-size: 17px;
  letter-spacing: 5px;

  color: #141414;

  pointer-events: none;
}

.chat-brand span {
  letter-spacing: .5px;
  font-size: 11px;
  color: #898985;
  font-weight: 400;
  margin-left: 8px;
}

#n8n-chat {
  width: 100%;
  height: 100%;
}

/* SACAR HEADER N8N */

#n8n-chat .chat-header,
#n8n-chat header,
#n8n-chat .chat-layout .chat-header {
  display: none !important;
}

#n8n-chat .chat-body {
  height: 100% !important;
  padding-top: 0 !important;
}

#n8n-chat .chat-wrapper {
  height: 100% !important;
}

/* COLORES N8N */

:root {
  --chat--color-primary: #11191f;
  --chat--color-primary-shade-50: #0c1419;
  --chat--color-primary-shade-100: #070b0e;

  --chat--color-secondary: #b48a49;

  --chat--color-white: #ffffff;

  --chat--color-light: #f5f5f3;
  --chat--color-light-shade-50: #eeeeeb;
  --chat--color-light-shade-100: #dfdfda;

  --chat--color-medium: #a9a9a4;
  --chat--color-dark: #171717;

  --chat--border-radius: 14px;

  --chat--window--width: 100%;
  --chat--window--height: 100%;
}

/* WIDGETS */

.widgets {
  min-height: 0;

  height: calc(100vh - 36px);

  display: flex;
  flex-direction: column;

  gap: 14px;

  overflow-y: auto;

  padding-right: 2px;

  scrollbar-width: thin;
}

.widget {
  flex-shrink: 0;

  background: white;

  border: 1px solid #e4e4e0;
  border-radius: 22px;

  padding: 18px;

  box-shadow: 0 6px 24px rgba(0,0,0,.035);
}

.widget-title {
  display: flex;
  align-items: center;
  gap: 9px;

  margin-bottom: 14px;

  font-size: 12px;
  font-weight: 700;
  letter-spacing: .6px;
}

/* HORA */

.time-value {
  font-size: 38px;
  font-weight: 500;
  letter-spacing: -1px;
}

.date-value {
  margin-top: 5px;
  color: #777;
  font-size: 13px;
  text-transform: capitalize;
}

/* CLIMA */

.weather-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
}

.weather-temp {
  font-size: 42px;
  font-weight: 500;
}

.weather-icon {
  font-size: 38px;
}

.weather-description {
  font-size: 14px;
  margin-bottom: 15px;
}

.weather-info {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;

  font-size: 12px;
  color: #666;
}

/* NOTICIAS */

.news-item {
  display: block;

  padding: 10px 0;

  border-bottom: 1px solid #eeeeeb;

  text-decoration: none;
  color: inherit;
}

.news-item:last-child {
  border-bottom: none;
}

.news-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
}

.news-meta {
  margin-top: 4px;
  font-size: 11px;
  color: #888;
}

/* MERCADOS */

.market-row {
  display: grid;

  grid-template-columns: 1fr auto auto;

  gap: 10px;

  padding: 10px 0;

  border-bottom: 1px solid #eeeeeb;

  font-size: 12px;
}

.market-row:last-child {
  border-bottom: none;
}

.market-price {
  font-weight: 600;
}

.market-change.up {
  color: #178441;
  font-weight: 700;
}

.market-change.down {
  color: #a4433b;
  font-weight: 700;
}

/* MICRO */

#voiceButton {
  position: fixed;

  right: 400px;
  bottom: 42px;

  width: 56px;
  height: 56px;

  border: none;
  border-radius: 50%;

  background: #11191f;
  color: white;

  font-size: 23px;

  cursor: pointer;

  z-index: 2147483647;

  box-shadow: 0 7px 22px rgba(0,0,0,.20);
}

#voiceButton.listening {
  background: #a23c37;
  transform: scale(1.08);
}

/* RESPONSIVE */

@media (max-width: 1250px) {

  .app {
    grid-template-columns: 105px minmax(0,1fr) 310px;
    gap: 14px;
  }

  #voiceButton {
    right: 350px;
  }

}

@media (max-width: 1050px) {

  .app {
    grid-template-columns: 95px minmax(0,1fr);
  }

  .widgets {
    display: none;
  }

  #voiceButton {
    right: 38px;
  }

}

@media (max-width: 700px) {

  .app {
    display: block;
    padding: 0;
  }

  .sidebar {
    display: none;
  }

  .center {
    height: 100vh;
  }

  .chat-card {
    border-radius: 0;
  }

}

</style>

</head>

<body>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="logo">◎</div>

  <div class="logo-title">
    SINGULARITY
  </div>


  <div class="nav">

    <div class="nav-item active" title="Chat">◌</div>

    <div class="nav-item" title="Seguimiento To Do">✓</div>

    <div class="nav-item" title="Seguimiento Acciones">▣</div>

    <div class="nav-item" title="Gestión de correos">✉</div>

    <div class="nav-item" title="Gestión de agenda">◫</div>

    <div class="nav-item" title="Acciones">⚡</div>

    <div class="nav-item" title="Configuración">⚙</div>

  </div>


  <div class="sidebar-bottom">
    <div class="online-dot"></div>
  </div>

</aside>



<!-- CHAT -->

<main class="center">

  <div class="chat-card">

    <div class="chat-brand">
      SINGULARITY
      <span>— AI Personal Assistant</span>
    </div>

    <div id="n8n-chat"></div>

  </div>

</main>



<!-- WIDGETS -->

<aside class="widgets">


<!-- HORA -->

<section class="widget">

  <div class="widget-title">

  </div>

  <div
    class="time-value"
    id="currentTime"
  >
    --:--
  </div>

  <div
    class="date-value"

  >
  </div>

</section>



<!-- CLIMA -->

<section class="widget">

  <div class="widget-title">
    ☀ CLIMA
  </div>


  <div class="weather-main">

    <div
      class="weather-temp"
      id="weatherTemp"
    >
      --
    </div>

    <div
      class="weather-icon"
      id="weatherIcon"
    >
      ☀
    </div>

  </div>


  <div
    class="weather-description"
    id="weatherDescription"
  >
    Cargando clima...
  </div>


  <div class="weather-info">

    <div>Ciudad de México</div>

    <div id="weatherWind">

    </div>

    <div id="weatherMax">
      Máx. --
    </div>

    <div id="weatherMin">

</section>



<!-- NOTICIAS -->

<section class="widget">

  </div>

    <div class="news-meta">

    </div>

</section>



<!-- MERCADOS -->

<section class="widget">

    ↗ MERCADOS
  </div>

  <div id="markets">

    <div class="news-meta">
      Cargando mercados...
    </div>

  </div>

</section>


</aside>


</div>



<button
  id="voiceButton"
  title="Hablar"
>
🎤
</button>



<script type="module">

import { createChat } from
'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';



/* ============================
   N8N CHAT
============================ */

createChat({

  webhookUrl:
  'https://gerardopustelnik.app.n8n.cloud/webhook/ad15c930-460c-4fca-a7bf-14d9774e4105/chat',

  target: '#n8n-chat',

  mode: 'fullscreen',

  loadPreviousSession: false,

  defaultLanguage: 'es',

  initialMessages: [
    'Hola, soy Singularity. ¿En qué puedo ayudarte?'
  ],

  i18n: {

    es: {

      title: '',

      subtitle: '',

      footer: '',

      getStarted:
      'Nueva conversación',

      inputPlaceholder:
      'Escribí o hablá con Singularity...'

    }

  }

});



/* ============================
   HORA REAL
============================ */

function actualizarHora() {

  const ahora = new Date();


  document.getElementById(
    'currentTime'
  ).textContent =
    new Intl.DateTimeFormat(
      'es-MX',
      {
        timeZone:
          'America/Mexico_City',

        hour:
          '2-digit',

        minute:
          '2-digit',

        hour12:
          false
      }
    ).format(ahora);


  document.getElementById(
    'currentDate'
  ).textContent =
    new Intl.DateTimeFormat(
      'es-MX',
      {
        timeZone:
          'America/Mexico_City',

        weekday:
          'long',

        day:
          'numeric',

        month:
          'long'
      }
    ).format(ahora);

}


actualizarHora();

setInterval(
  actualizarHora,
  30000
);



/* ============================
   CLIMA REAL
============================ */

async function cargarClima() {

  try {

    const url =
    'https://api.open-meteo.com/v1/forecast?latitude=19.4326&longitude=-99.1332&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FMexico_City';


    const response =
      await fetch(url);


    const data =
      await response.json();


    document.getElementById(
      'weatherTemp'
    ).textContent =
      Math.round(
        data.current.temperature_2m
      ) + '°C';


    document.getElementById(
      'weatherWind'
    ).textContent =
      'Viento ' +
      Math.round(
        data.current.wind_speed_10m
      ) +
      ' km/h';


    document.getElementById(
      'weatherMax'
    ).textContent =
      'Máx. ' +
      Math.round(
        data.daily.temperature_2m_max[0]
      ) +
      '°';


    document.getElementById(
      'weatherMin'
    ).textContent =
      'Mín. ' +
      Math.round(
        data.daily.temperature_2m_min[0]
      ) +
      '°';


    const code =
      data.current.weather_code;


    let descripcion =
      'Despejado';

    let icono =
      '☀';


    if (code >= 1 && code <= 3) {

      descripcion =
        'Parcialmente nublado';

      icono =
        '⛅';

    }

    else if (
      code >= 45 &&
      code <= 48
    ) {

      descripcion =
        'Neblina';

      icono =
        '☁';

    }

    else if (code >= 51) {

      descripcion =
        'Lluvia';

      icono =
        '🌧';

    }


    document.getElementById(
      'weatherDescription'
    ).textContent =
      descripcion;


    document.getElementById(
      'weatherIcon'
    ).textContent =
      icono;

  }

  catch {

    document.getElementById(
      'weatherDescription'
    ).textContent =
      'Clima no disponible';

  }

}


cargarClima();



/* ============================
   NOTICIAS REALES
============================ */

async function cargarNoticias() {

  const contenedor =
    document.getElementById(
      'news'
    );


  try {

    const feed =
      'https://news.google.com/rss?hl=es-419&gl=MX&ceid=MX:es-419';


    const url =
      'https://api.rss2json.com/v1/api.json?rss_url=' +
      encodeURIComponent(feed);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (
      data.status !== 'ok' ||
      !data.items
    ) {
      throw new Error();
    }


    contenedor.innerHTML = '';


    data.items
      .slice(0,4)
      .forEach(
        item => {

          const link =
            document.createElement(
              'a'
            );


          link.className =
            'news-item';


          link.href =
            item.link;


          link.target =
            '_blank';


          const fecha =
            new Date(
              item.pubDate
            );


          link.innerHTML =
            '<div class="news-title">' +
            item.title +
            '</div>' +

            '<div class="news-meta">' +
            fecha.toLocaleTimeString(
              'es-MX',
              {
                hour:
                  '2-digit',

                minute:
                  '2-digit'
              }
            ) +
            '</div>';


          contenedor.appendChild(
            link
          );

        }
      );

  }

  catch {

    contenedor.innerHTML =
      '<div class="news-meta">Noticias no disponibles</div>';

  }

}


cargarNoticias();



/* ============================
   MERCADOS REALES
============================ */

const mercados = [

  {
    nombre: 'S&P 500',
    simbolo: '^GSPC'
  },

  {
    nombre: 'NASDAQ',
    simbolo: '^IXIC'
  },

  {
    nombre: 'Dow Jones',
    simbolo: '^DJI'
  },

  {
    nombre: 'IPC México',
    simbolo: '^MXX'
  }

];


async function obtenerMercado(
  mercado
) {

  const yahoo =
    'https://query1.finance.yahoo.com/v8/finance/chart/' +
    encodeURIComponent(
      mercado.simbolo
    ) +
    '?range=5d&interval=1d';


  let response;


  try {

    response =
      await fetch(
        yahoo
      );

  }

  catch {

    const proxy =
      'https://api.allorigins.win/raw?url=' +
      encodeURIComponent(
        yahoo
      );


    response =
      await fetch(
        proxy
      );

  }


  const data =
    await response.json();


  const resultado =
    data.chart.result[0];


  const cierres =
    resultado.indicators.quote[0]
      .close
      .filter(
        valor =>
          valor !== null
      );


  const ultimo =
    cierres[
      cierres.length - 1
    ];


  const anterior =
    cierres[
      cierres.length - 2
    ];


  const cambio =
    (
      (
        ultimo -
        anterior
      )
      /
      anterior
    )
    *
    100;


  return {

    nombre:
      mercado.nombre,

    ultimo:
      ultimo,

    cambio:
      cambio

  };

}



async function cargarMercados() {

  const contenedor =
    document.getElementById(
      'markets'
    );


  try {

    const resultados =
      await Promise.all(
        mercados.map(
          obtenerMercado
        )
      );


    contenedor.innerHTML = '';


    resultados.forEach(
      mercado => {

        const fila =
          document.createElement(
            'div'
          );


        fila.className =
          'market-row';


        const clase =
          mercado.cambio >= 0
          ? 'up'
          : 'down';


        const signo =
          mercado.cambio >= 0
          ? '+'
          : '';


        fila.innerHTML =

          '<span>' +
          mercado.nombre +
          '</span>' +

          '<span class="market-price">' +
          mercado.ultimo.toLocaleString(
            'es-MX',
            {
              maximumFractionDigits: 2
            }
          ) +
          '</span>' +

          '<span class="market-change ' +
          clase +
          '">' +
          signo +
          mercado.cambio.toFixed(2) +
          '%</span>';


        contenedor.appendChild(
          fila
        );

      }
    );

  }

  catch {

    contenedor.innerHTML =
      '<div class="news-meta">Mercados no disponibles</div>';

  }

}


cargarMercados();



/* ============================
   VOZ
============================ */

const boton =
document.getElementById(
  'voiceButton'
);


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


function buscarInput() {

  return document.querySelector(
    '#n8n-chat textarea, #n8n-chat input[type="text"]'
  );

}


function buscarEnviar() {

  return document.querySelector(
    '#n8n-chat button[type="submit"]'
  );

}


if (!SpeechRecognition) {

  boton.disabled = true;

}

else {

  const recognition =
    new SpeechRecognition();


  recognition.lang =
    'es-MX';

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  boton.onclick =
  () => {

    boton.textContent =
      '●';

    boton.classList.add(
      'listening'
    );

    recognition.start();

  };


  recognition.onresult =
  event => {

    const mensaje =
      event.results[0][0]
      .transcript;


    const input =
      buscarInput();


    if (!input)
      return;


    input.value =
      mensaje;


    input.dispatchEvent(
      new Event(
        'input',
        {
          bubbles: true
        }
      )
    );


    input.dispatchEvent(
      new Event(
        'change',
        {
          bubbles: true
        }
      )
    );


    setTimeout(
      () => {

        const enviar =
          buscarEnviar();


        if (enviar) {

          enviar.click();

        }

        else {

          input.dispatchEvent(

            new KeyboardEvent(
              'keydown',
              {
                key: 'Enter',
                code: 'Enter',
                bubbles: true
              }
            )

          );

        }

      },
      300
    );

  };


  recognition.onend =
  () => {

    boton.textContent =
      '🎤';

    boton.classList.remove(
      'listening'
    );

  };


  recognition.onerror =
    recognition.onend;

}

</script>
