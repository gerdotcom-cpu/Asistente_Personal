<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singularity</title>

<link
  href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
  rel="stylesheet"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f3;
  color: #171717;
}

:root {
  --chat--color-primary: #11191f;
  --chat--color-primary-shade-50: #0c1419;
  --chat--color-primary-shade-100: #070b0e;
  --chat--color-secondary: #b48a49;
  --chat--color-white: #ffffff;
  --chat--color-light: #f5f5f3;
  --chat--color-light-shade-50: #eeeeeb;
  --chat--color-light-shade-100: #dfdfda;
  --chat--color-medium: #a9a9a4;
  --chat--color-dark: #171717;
  --chat--border-radius: 14px;
  --chat--window--width: 100%;
  --chat--window--height: 100%;

  --chat--message--user--background: #CFE8FF;
  --chat--message--user--color: #17324D;

  --chat--message--bot--background: #EDF6FD;
  --chat--message--bot--color: #1D3448;
}


/* =========================================================
   LAYOUT
========================================================= */

.app {
  display: grid;
  grid-template-columns: 118px minmax(0, 1fr) 360px;
  gap: 18px;
  width: 100vw;
  height: 100vh;
  padding: 18px;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  height: calc(100vh - 36px);
  border-radius: 34px;
  background: linear-gradient(180deg, #11181b 0%, #081319 100%);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px 10px 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

.nav {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  padding-top: 8px;
}

.nav-item {
  width: 72px;
  height: 64px;
  border-radius: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  color: white;
  opacity: .88;
  cursor: pointer;
  transition: background .2s ease, color .2s ease;
}

.nav-item:hover {
  background: rgba(255,255,255,.06);
  color: #d6b268;
}

.sidebar-bottom {
  margin-top: auto;
  width: 100%;
  padding-top: 18px;
  display: flex;
  justify-content: center;
}

.online-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #58cc66;
  box-shadow: 0 0 8px rgba(88,204,102,.4);
}


/* =========================================================
   CENTRO
========================================================= */

.center {
  min-width: 0;
  min-height: 0;
  height: calc(100vh - 36px);
}

.chat-card {
  width: 100%;
  height: 100%;
  background: white;
  border: 1px solid #e4e4e0;
  border-radius: 28px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 8px 30px rgba(0,0,0,.035);
}


/* =========================================================
   HEADER SINGULARITY
========================================================= */

.chat-brand {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 82px;
  z-index: 50;
  display: flex;
  align-items: center;
  padding: 0 28px;
  background: rgba(255,255,255,.98);
  pointer-events: none;
}

.singularity-logo {
  width: 46px;
  height: 46px;
  margin-right: 16px;
  border-radius: 50%;
  border: 1px solid #b9944f;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #b9944f;
  font-size: 24px;
  box-shadow: 0 0 18px rgba(185,148,79,.15);
  flex-shrink: 0;
}

.brand-name {
  font-size: 19px;
  letter-spacing: 5px;
  font-weight: 500;
  color: #11191f;
}

.brand-subtitle {
  margin-left: 14px;
  font-size: 14px;
  letter-spacing: .4px;
  color: #777;
  font-weight: 400;
}


/* =========================================================
   CHAT N8N
========================================================= */

#n8n-chat {
  width: 100%;
  height: 100%;
  font-size: 14px;
}

#n8n-chat .chat-header,
#n8n-chat header,
#n8n-chat .chat-layout .chat-header {
  display: none !important;
}

#n8n-chat .chat-body {
  height: 100% !important;
  padding-top: 82px !important;
}

#n8n-chat .chat-wrapper {
  height: 100% !important;
}

#n8n-chat .chat-message {
  font-size: 14px !important;
  line-height: 1.45 !important;
}

#n8n-chat p,
#n8n-chat li,
#n8n-chat td,
#n8n-chat th {
  font-size: 14px;
  line-height: 1.45;
}


/* =========================================================
   COLORES CHAT
========================================================= */

#n8n-chat .chat-message-from-user,
#n8n-chat .chat-message.user,
#n8n-chat [data-message-type="user"] {
  background: #CFE8FF !important;
  color: #17324D !important;
  border-color: #B9DCF8 !important;
}

#n8n-chat .chat-message-from-bot,
#n8n-chat .chat-message.bot,
#n8n-chat [data-message-type="bot"] {
  background: #EDF6FD !important;
  color: #1D3448 !important;
  border-color: #D8EAF7 !important;
}


/* =========================================================
   COLUMNA WIDGETS
========================================================= */

.widgets {
  min-height: 0;
  height: calc(100vh - 36px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
}

.widget {
  flex-shrink: 0;
  border-radius: 22px;
  padding: 17px;
  border: 1px solid rgba(0,0,0,.06);
  box-shadow: 0 6px 24px rgba(0,0,0,.035);
}

.widget-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .7px;
  color: #303030;
}


/* =========================================================
   HORA
========================================================= */

.widget-time {
  background: linear-gradient(
    135deg,
    #fffdf7 0%,
    #f5ecd9 100%
  );
  border-color: #eadbbd;
}

.time-value {
  font-size: 34px;
  font-weight: 500;
  letter-spacing: -1px;
  color: #2b3135;
}

.date-value {
  margin-top: 5px;
  color: #777;
  font-size: 12px;
  text-transform: capitalize;
}


/* =========================================================
   TO DO - AVANCE ESPERADO
========================================================= */

.widget-todo-week {
  background: linear-gradient(
    135deg,
    #f7fbff 0%,
    #e8f3fb 100%
  );
  border-color: #d5e7f4;
}

.week-list {
  max-height: 155px;
  overflow-y: auto;
  padding-right: 5px;
  scrollbar-width: thin;
}

.week-item {
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,.07);
}

.week-item:last-child {
  border-bottom: none;
}

.week-client {
  font-size: 11px;
  font-weight: 700;
  color: #23527a;
  margin-bottom: 3px;
}

.week-issue {
  font-size: 10px;
  color: #788894;
  margin-bottom: 5px;
}

.week-action {
  font-size: 12px;
  line-height: 1.35;
  color: #243746;
  white-space: pre-line;
}

.empty-state {
  font-size: 11px;
  color: #8b969d;
  padding: 8px 0;
}


/* =========================================================
   DONUTS
========================================================= */

.widget-status {
  background: linear-gradient(
    135deg,
    #ffffff 0%,
    #f4f8fb 100%
  );
  border-color: #dce6ed;
}

.status-layout {
  display: flex;
  align-items: center;
  gap: 22px;
  min-height: 126px;
}

.donut {
  width: 108px;
  height: 108px;
  flex-shrink: 0;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.donut::after {
  content: "";
  position: absolute;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #ffffff;
}

.donut-total {
  position: relative;
  z-index: 2;
  text-align: center;
}

.donut-number {
  display: block;
  font-size: 23px;
  font-weight: 600;
  color: #23323d;
}

.donut-label {
  display: block;
  margin-top: 1px;
  font-size: 9px;
  color: #8a969e;
  text-transform: uppercase;
  letter-spacing: .4px;
}

.status-legend {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.legend-row {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: #53636e;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.legend-blue {
  background: #2878b8;
}

.legend-red {
  background: #c5483f;
}

.legend-green {
  background: #43a66b;
}

.legend-value {
  font-weight: 700;
  color: #263943;
}


/* =========================================================
   ACCIONES ESTA SEMANA
========================================================= */

.widget-actions-week {
  background: linear-gradient(
    135deg,
    #fffaf7 0%,
    #f8ebe5 100%
  );
  border-color: #ecd8cf;
}

.action-week-item {
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,.07);
}

.action-week-item:last-child {
  border-bottom: none;
}

.action-week-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}

.action-week-date {
  font-size: 10px;
  font-weight: 700;
  color: #a24a42;
}

.action-week-responsable {
  font-size: 10px;
  color: #7c858b;
}

.action-week-name {
  font-size: 12px;
  line-height: 1.35;
  color: #343d42;
}

.action-week-status {
  margin-top: 4px;
  font-size: 10px;
  font-weight: 600;
}

.status-en-curso {
  color: #2878b8;
}

.status-retrasado {
  color: #c5483f;
}

.status-cerrado {
  color: #43a66b;
}


/* =========================================================
   VOZ
========================================================= */

#voiceButton {
  position: fixed;
  right: 400px;
  bottom: 42px;
  width: 54px;
  height: 54px;
  border: none;
  border-radius: 50%;
  background: #11191f;
  color: white;
  font-size: 22px;
  cursor: pointer;
  z-index: 2147483647;
  box-shadow: 0 7px 22px rgba(0,0,0,.20);
}

#voiceButton.listening {
  background: #a23c37;
  transform: scale(1.08);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1250px) {

  .app {
    grid-template-columns:
      105px
      minmax(0,1fr)
      310px;

    gap: 14px;
  }

  #voiceButton {
    right: 350px;
  }

}

@media (max-width: 1050px) {

  .app {
    grid-template-columns:
      95px
      minmax(0,1fr);
  }

  .widgets {
    display: none;
  }

  #voiceButton {
    right: 38px;
  }

}

@media (max-width: 700px) {

  .app {
    display: block;
    padding: 0;
  }

  .sidebar {
    display: none;
  }

  .center {
    height: 100vh;
  }

  .chat-card {
    border-radius: 0;
  }

  .brand-name {
    font-size: 16px;
    letter-spacing: 3px;
  }

  .brand-subtitle {
    font-size: 11px;
  }

}

</style>

</head>


<body>

<script type="module">


import { createChat } from
'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';



/* =========================================================
   CHAT
========================================================= */

createChat({

  webhookUrl:
  'https://gerardopustelnik.app.n8n.cloud/webhook/ad15c930-460c-4fca-a7bf-14d9774e4105/chat',

  target:
  '#n8n-chat',

  mode:
  'fullscreen',

  loadPreviousSession:
  false,

  defaultLanguage:
  'es',

  initialMessages: [
    'Hola, soy Singularity. ¿En qué puedo ayudarte?'
  ],

  i18n: {

    es: {

      title: '',

      subtitle: '',

      footer: '',

      getStarted:
        'Nueva conversación',

      inputPlaceholder:
        'Escribí o hablá con Singularity...'

    }

  }

});



/* =========================================================
   HORA
========================================================= */

function actualizarHora() {

  const ahora =
    new Date();


  document.getElementById(
    'currentTime'
  ).textContent =

    new Intl.DateTimeFormat(
      'es-MX',
      {

        timeZone:
          'America/Mexico_City',

        hour:
          '2-digit',

        minute:
          '2-digit',

        hour12:
          false

      }

    ).format(ahora);



  document.getElementById(
    'currentDate'
  ).textContent =

    new Intl.DateTimeFormat(
      'es-MX',
      {

        timeZone:
          'America/Mexico_City',

        weekday:
          'long',

        day:
          'numeric',

        month:
          'long'

      }

    ).format(ahora);

}


actualizarHora();


setInterval(
  actualizarHora,
  30000
);



/* =========================================================
   DASHBOARD
========================================================= */

const DASHBOARD_URL =
  'https://gerardopustelnik.app.n8n.cloud/webhook/Dashboard_Singularity';



function porcentaje(
  cantidad,
  total
) {

  if (!total) {
    return 0;
  }

  return (
    cantidad / total
  ) * 100;

}



function actualizarDonut(
  donutId,
  totalId,
  enCursoId,
  retrasadosId,
  cerradosId,
  datos
) {

  const total =
    Number(datos.total || 0);

  const enCurso =
    Number(datos.enCurso || 0);

  const retrasados =
    Number(datos.retrasados || 0);

  const cerrados =
    Number(datos.cerrados || 0);


  document.getElementById(
    totalId
  ).textContent =
    total;


  document.getElementById(
    enCursoId
  ).textContent =
    enCurso;


  document.getElementById(
    retrasadosId
  ).textContent =
    retrasados;


  document.getElementById(
    cerradosId
  ).textContent =
    cerrados;


  const donut =
    document.getElementById(
      donutId
    );


  if (total === 0) {

    donut.style.background =
      '#e7edf1';

    return;

  }


  const pctEnCurso =
    porcentaje(
      enCurso,
      total
    );


  const pctRetrasados =
    porcentaje(
      retrasados,
      total
    );


  const finRetrasados =
    pctEnCurso +
    pctRetrasados;


  donut.style.background =

    `conic-gradient(
      #2878b8 0% ${pctEnCurso}%,
      #c5483f ${pctEnCurso}% ${finRetrasados}%,
      #43a66b ${finRetrasados}% 100%
    )`;

}



function cargarAvanceEsperado(
  lista
) {

  const contenedor =
    document.getElementById(
      'todoWeek'
    );


  if (
    !lista ||
    lista.length === 0
  ) {

    contenedor.innerHTML =

      '<div class="empty-state">Sin avances esperados cargados.</div>';

    return;

  }


  contenedor.innerHTML =
    '';


  lista.forEach(
    item => {


      const fila =
        document.createElement(
          'div'
        );


      fila.className =
        'week-item';


      const cliente =
        item.cliente || 'Sin cliente';


      const issue =
        item.issue || '';


      const avance =
        item.avanceEsperado || '';


      fila.innerHTML =

        '<div class="week-client">'
        +
        cliente
        +
        '</div>'

        +

        '<div class="week-issue">'
        +
        issue
        +
        '</div>'

        +

        '<div class="week-action">'
        +
        avance
        +
        '</div>';


      contenedor.appendChild(
        fila
      );

    }

  );

}



function claseEstado(
  estado
) {

  const valor =
    String(
      estado || ''
    ).toLowerCase();


  if (
    valor.includes(
      'retras'
    )
  ) {

    return 'status-retrasado';

  }


  if (
    valor.includes(
      'cerr'
    )
  ) {

    return 'status-cerrado';

  }


  return 'status-en-curso';

}



function cargarAccionesSemana(
  lista
) {

  const contenedor =
    document.getElementById(
      'actionsWeek'
    );


  if (
    !lista ||
    lista.length === 0
  ) {

    contenedor.innerHTML =

      '<div class="empty-state">No hay acciones que venzan esta semana.</div>';

    return;

  }


  contenedor.innerHTML =
    '';


  lista.forEach(
    item => {


      const fila =
        document.createElement(
          'div'
        );


      fila.className =
        'action-week-item';


      const fecha =
        item.fecha || '';


      const responsable =
        item.responsable || '';


      const accion =
        item.accion || '';


      const estado =
        item.estado || '';


      const clase =
        claseEstado(
          estado
        );


      fila.innerHTML =

        '<div class="action-week-top">'

        +

          '<span class="action-week-date">'
          +
          fecha
          +
          '</span>'

        +

          '<span class="action-week-responsable">'
          +
          responsable
          +
          '</span>'

        +

        '</div>'

        +

        '<div class="action-week-name">'
        +
        accion
        +
        '</div>'

        +

        '<div class="action-week-status '
        +
        clase
        +
        '">'
        +
        estado
        +
        '</div>';


      contenedor.appendChild(
        fila
      );

    }

  );

}



async function cargarDashboard() {

  try {

    const response =
      await fetch(
        DASHBOARD_URL,
        {
          method: 'GET',
          cache: 'no-store'
        }
      );


    if (!response.ok) {

      throw new Error(
        'Error dashboard'
      );

    }


    const data =
      await response.json();



    cargarAvanceEsperado(
      data.avanceEsperadoSemana
    );



    actualizarDonut(

      'todoDonut',

      'todoTotal',

      'todoEnCurso',

      'todoRetrasados',

      'todoCerrados',

      data.todoEstado || {}

    );



    cargarAccionesSemana(
      data.accionesSemana
    );



    actualizarDonut(

      'actionsDonut',

      'actionsTotal',

      'actionsEnCurso',

      'actionsRetrasados',

      'actionsCerrados',

      data.accionesEstado || {}

    );


  }

  catch (error) {


    document.getElementById(
      'todoWeek'
    ).innerHTML =

      '<div class="empty-state">Dashboard no disponible.</div>';


    document.getElementById(
      'actionsWeek'
    ).innerHTML =

      '<div class="empty-state">Dashboard no disponible.</div>';


    console.error(
      'Dashboard Singularity:',
      error
    );

  }

}


cargarDashboard();


setInterval(
  cargarDashboard,
  60000
);



/* =========================================================
   VOZ
========================================================= */

const boton =
  document.getElementById(
    'voiceButton'
  );



const SpeechRecognition =

  window.SpeechRecognition

  ||

  window.webkitSpeechRecognition;



function buscarInput() {


  return document.querySelector(

    '#n8n-chat textarea, #n8n-chat input[type="text"]'

  );


}



function buscarEnviar() {


  return document.querySelector(

    '#n8n-chat button[type="submit"]'

  );


}



if (!SpeechRecognition) {


  boton.disabled =
    true;


}


else {


  const recognition =
    new SpeechRecognition();



  recognition.lang =
    'es-MX';


  recognition.continuous =
    false;


  recognition.interimResults =
    false;



  boton.onclick =
  () => {


    boton.textContent =
      '●';


    boton.classList.add(
      'listening'
    );


    recognition.start();


  };



  recognition.onresult =
  event => {


    const mensaje =

      event.results[0][0]
      .transcript;



    const input =
      buscarInput();



    if (!input) {

      return;

    }



    input.value =
      mensaje;



    input.dispatchEvent(

      new Event(
        'input',
        {

          bubbles:
            true

        }
      )

    );



    input.dispatchEvent(

      new Event(
        'change',
        {

          bubbles:
            true

        }
      )

    );



    setTimeout(

      () => {


        const enviar =
          buscarEnviar();



        if (enviar) {


          enviar.click();


        }


        else {


          input.dispatchEvent(

            new KeyboardEvent(
              'keydown',
              {

                key:
                  'Enter',

                code:
                  'Enter',

                bubbles:
                  true

              }
            )

          );


        }


      },

      300

    );


  };



  recognition.onend =
  () => {


    boton.textContent =
      '🎤';


    boton.classList.remove(
      'listening'
    );


  };



  recognition.onerror =
    recognition.onend;


}


</script>
