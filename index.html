<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asistente Personal</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #voiceBar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
    }

    #voiceButton {
      font-size: 20px;
      padding: 10px 25px;
      cursor: pointer;
    }

    #n8n-chat {
      width: 100%;
      height: calc(100vh - 70px);
    }
  </style>
</head>

<body>

  <div id="voiceBar">
    <span>Asistente por voz</span>
    <button id="voiceButton">🎤 HABLAR</button>
  </div>

  <div id="n8n-chat"></div>

  <script type="module">

    import { createChat } from
      'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
      webhookUrl:
        'https://gerardopustelnik.app.n8n.cloud/webhook/ad15c930-460c-4fca-a7bf-14d9774e4105/chat',

      target: '#n8n-chat',
      mode: 'fullscreen',
      loadPreviousSession: false,
      defaultLanguage: 'es',

      initialMessages: [
        'Hola, soy tu asistente personal. ¿En qué puedo ayudarte?'
      ],

      i18n: {
        es: {
          title: 'Asistente Personal',
          subtitle: '',
          footer: '',
          getStarted: 'Nueva conversación',
          inputPlaceholder: 'Escribí o hablá...'
        }
      }
    });


    const button = document.getElementById('voiceButton');

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      button.textContent = '🎤 VOZ NO DISPONIBLE';
      button.disabled = true;

    } else {

      const recognition = new SpeechRecognition();

      recognition.lang = 'es-MX';
      recognition.continuous = false;
      recognition.interimResults = false;


      button.onclick = () => {

        button.textContent = '🔴 ESCUCHANDO...';

        recognition.start();

      };


      recognition.onresult = (event) => {

        const mensaje =
          event.results[0][0].transcript;

        button.textContent = '🎤 HABLAR';

        alert('Escuché: ' + mensaje);

      };


      recognition.onend = () => {

        button.textContent = '🎤 HABLAR';

      };

    }

  </script>

</body>
</html>
