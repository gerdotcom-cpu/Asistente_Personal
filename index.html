<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOL · Asistente Personal</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f4f1;
    }

    body {
      display: flex;
    }


    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      width: 350px;
      min-width: 350px;
      height: 100vh;

      background:
        radial-gradient(
          circle at 70% 5%,
          rgba(190,160,115,.20),
          transparent 28%
        ),
        linear-gradient(
          155deg,
          #292824 0%,
          #191a19 45%,
          #111312 100%
        );

      color: white;

      display: flex;
      flex-direction: column;

      padding: 42px 30px 30px;

      position: relative;
      overflow: hidden;
    }


    /* detalle arquitectónico */

    .sidebar::before {
      content: "";

      position: absolute;

      width: 420px;
      height: 230px;

      top: -80px;
      left: 40px;

      background:
        linear-gradient(
          125deg,
          transparent 30%,
          rgba(230,220,200,.13) 31%,
          rgba(230,220,200,.04) 55%,
          transparent 56%
        );

      transform: rotate(-8deg);

      pointer-events: none;
    }


    /* =========================
       MARCA SOL
       ========================= */

    .brand {
      position: relative;
      z-index: 2;

      margin-bottom: 55px;
    }


    .sol-logo {
      width: 68px;
      height: 68px;

      border: 2px solid #c9ad7d;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;

      color: #dbc398;

      font-size: 30px;
      font-weight: 300;

      box-shadow:
        0 0 0 7px rgba(201,173,125,.05),
        0 0 30px rgba(201,173,125,.08);
    }


    .brand-name {
      font-size: 36px;
      font-weight: 300;

      letter-spacing: 10px;

      line-height: 1;
    }


    .brand-subtitle {
      margin-top: 12px;

      font-size: 11px;

      letter-spacing: 3px;

      color: #c9ad7d;
    }


    /* =========================
       MENÚ
       ========================= */

    .menu {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;

      gap: 7px;
    }


    .menu-item {
      height: 62px;

      padding: 0 18px;

      border-radius: 15px;

      display: flex;
      align-items: center;

      gap: 17px;

      color: #eeeeec;

      font-size: 16px;
    }


    .menu-item.active {
      background: rgba(255,255,255,.10);

      color: white;

      font-weight: 600;
    }


    .menu-icon {
      width: 28px;

      text-align: center;

      font-size: 21px;

      color: #d6d6d2;
    }


    .menu-item.active .menu-icon {
      color: #d7bb88;
    }


    /* =========================
       ESTADO
       ========================= */

    .status {
      margin-top: auto;

      padding: 24px 10px 0;

      border-top: 1px solid rgba(255,255,255,.15);

      position: relative;
      z-index: 2;
    }


    .status-main {
      display: flex;

      align-items: center;

      gap: 12px;

      font-weight: 600;

      font-size: 15px;
    }


    .status-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #65d05d;
    }


    .status-sub {
      margin-top: 8px;
      margin-left: 22px;

      font-size: 12px;

      color: #a9aaa7;
    }


    /* =========================
       DERECHA
       ========================= */

    .main {
      flex: 1;

      height: 100vh;

      padding: 28px;

      background: #f7f7f5;
    }


    .chat-shell {
      width: 100%;
      height: 100%;

      background: white;

      border: 1px solid #e1e0dc;

      border-radius: 24px;

      overflow: hidden;

      box-shadow:
        0 15px 40px rgba(0,0,0,.045);

      position: relative;
    }


    #n8n-chat {
      width: 100%;
      height: 100%;
    }


    /* =========================
       AJUSTES VISUALES N8N
       ========================= */

    :root {

      --chat--color-primary: #1b1c1b;
      --chat--color-primary-shade-50: #111312;
      --chat--color-primary-shade-100: #000000;

      --chat--color-secondary: #c3a574;

      --chat--color-white: #ffffff;

      --chat--color-light: #f5f5f3;
      --chat--color-light-shade-50: #eeeeeb;
      --chat--color-light-shade-100: #deded9;

      --chat--color-medium: #a8a8a3;
      --chat--color-dark: #171817;

      --chat--border-radius: 12px;

      --chat--window--width: 100%;
      --chat--window--height: 100%;
    }


    /* =========================
       MICRÓFONO
       ========================= */

    #voiceButton {

      position: fixed;

      right: 52px;
      bottom: 46px;

      width: 58px;
      height: 58px;

      border: 0;

      border-radius: 50%;

      background: #171817;

      color: white;

      font-size: 25px;

      cursor: pointer;

      z-index: 2147483647;

      box-shadow:
        0 7px 22px rgba(0,0,0,.22);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    #voiceButton:hover {

      transform: translateY(-2px);

      box-shadow:
        0 10px 28px rgba(0,0,0,.25);
    }


    #voiceButton.listening {

      transform: scale(1.08);

      background: #9f3434;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 850px) {

      .sidebar {
        display: none;
      }

      .main {
        padding: 0;
      }

      .chat-shell {
        border-radius: 0;
        border: 0;
      }

      #voiceButton {
        right: 18px;
        bottom: 20px;
      }
    }

  </style>
</head>


<body>


  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <div class="sol-logo">
        S
      </div>

      <div class="brand-name">
        SOL
      </div>

      <div class="brand-subtitle">
        ASISTENTE PERSONAL
      </div>

    </div>


    <nav class="menu">

      <div class="menu-item active">
        <div class="menu-icon">◫</div>
        <div>Chat</div>
      </div>

      <div class="menu-item">
        <div class="menu-icon">✓</div>
        <div>Seguimiento To Do</div>
      </div>

      <div class="menu-item">
        <div class="menu-icon">☷</div>
        <div>Seguimiento Acciones</div>
      </div>

      <div class="menu-item">
        <div class="menu-icon">✉</div>
        <div>Gestión de correos</div>
      </div>

      <div class="menu-item">
        <div class="menu-icon">▣</div>
        <div>Gestión de agenda</div>
      </div>

    </nav>


    <div class="status">

      <div class="status-main">

        <div class="status-dot"></div>

        <div>
          Conectado
        </div>

      </div>

      <div class="status-sub">
        SOL está activo
      </div>

    </div>

  </aside>



  <!-- CHAT -->

  <main class="main">

    <div class="chat-shell">

      <div id="n8n-chat"></div>

    </div>

  </main>



  <!-- VOZ -->

  <button
    id="voiceButton"
    title="Hablar"
  >
    🎤
  </button>



  <script type="module">

    import { createChat } from
      'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';


    /* =========================
       CHAT N8N
       ========================= */

    createChat({

      webhookUrl:
        'https://gerardopustelnik.app.n8n.cloud/webhook/ad15c930-460c-4fca-a7bf-14d9774e4105/chat',

      target: '#n8n-chat',

      mode: 'fullscreen',

      loadPreviousSession: false,

      defaultLanguage: 'es',

      initialMessages: [
        'Hola, soy SOL. ¿En qué puedo ayudarte?'
      ],

      i18n: {

        es: {

          title: 'SOL',

          subtitle: '',

          footer: '',

          getStarted: 'Nueva conversación',

          inputPlaceholder:
            'Escribí o hablá con SOL...'

        }

      }

    });



    /* =========================
       VOZ
       ========================= */

    const boton =
      document.getElementById('voiceButton');


    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    function buscarInput() {

      return document.querySelector(
        '#n8n-chat textarea, #n8n-chat input[type="text"]'
      );

    }


    function buscarBotonEnviar() {

      return document.querySelector(
        '#n8n-chat button[type="submit"]'
      );

    }



    if (!SpeechRecognition) {

      boton.disabled = true;

      boton.title =
        'Este navegador no soporta reconocimiento de voz';

    }

    else {

      const recognition =
        new SpeechRecognition();


      recognition.lang = 'es-MX';

      recognition.continuous = false;

      recognition.interimResults = false;



      boton.addEventListener(
        'click',
        () => {

          boton.textContent = '●';

          boton.classList.add(
            'listening'
          );

          recognition.start();

        }
      );



      recognition.onresult =
        (event) => {

          const mensaje =
            event.results[0][0].transcript;


          const input =
            buscarInput();


          if (!input)
            return;


          input.value =
            mensaje;


          input.dispatchEvent(

            new Event(
              'input',
              {
                bubbles: true
              }
            )

          );


          input.dispatchEvent(

            new Event(
              'change',
              {
                bubbles: true
              }
            )

          );


          setTimeout(
            () => {

              const enviar =
                buscarBotonEnviar();


              if (enviar) {

                enviar.click();

              }

              else {

                input.dispatchEvent(

                  new KeyboardEvent(
                    'keydown',
                    {
                      key: 'Enter',
                      code: 'Enter',
                      bubbles: true
                    }
                  )

                );

              }

            },
            300
          );

        };



      recognition.onend =
        () => {

          boton.textContent = '🎤';

          boton.classList.remove(
            'listening'
          );

        };


      recognition.onerror =
        () => {

          boton.textContent = '🎤';

          boton.classList.remove(
            'listening'
          );

        };

    }

  </script>

</body>
</html>
