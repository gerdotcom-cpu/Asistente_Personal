<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOL · Asistente Personal</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f4f1;
    }

    body {
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */

    .sidebar {
      width: 330px;
      min-width: 330px;
      height: 100vh;
      background:
        linear-gradient(
          155deg,
          #292825 0%,
          #171817 42%,
          #111312 100%
        );
      color: white;
      display: flex;
      flex-direction: column;
      padding: 42px 28px 30px;
      position: relative;
      overflow: hidden;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      width: 330px;
      height: 240px;
      top: -50px;
      right: -120px;
      background: linear-gradient(
        135deg,
        transparent 30%,
        rgba(210,185,145,.16) 50%,
        transparent 70%
      );
      transform: rotate(-15deg);
    }

    .brand {
      position: relative;
      z-index: 2;
      margin-bottom: 65px;
    }

    .sol-symbol {
      width: 62px;
      height: 62px;
      border: 2px solid #d6bd91;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      font-weight: 300;
      color: #e3c99a;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(214,189,145,.10);
    }

    .brand-name {
      font-size: 34px;
      font-weight: 300;
      letter-spacing: 9px;
    }

    .brand-subtitle {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 3px;
      color: #d6bd91;
    }

    .menu {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      height: 58px;
      padding: 0 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      color: #e9e9e7;
    }

    .menu-item.active {
      background: rgba(255,255,255,.10);
      color: white;
      font-weight: 600;
    }

    .menu-icon {
      width: 28px;
      text-align: center;
      font-size: 21px;
    }

    .status {
      margin-top: auto;
      padding: 24px 10px 0;
      border-top: 1px solid rgba(255,255,255,.14);
      position: relative;
      z-index: 2;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64cf5a;
    }

    .status-sub {
      margin: 7px 0 0 22px;
      font-size: 12px;
      color: #aaa;
    }

    /* ÁREA DEL CHAT */

    .main {
      flex: 1;
      height: 100vh;
      padding: 28px;
      background: #f7f7f5;
    }

    .chat-shell {
      width: 100%;
      height: 100%;
      background: white;
      border: 1px solid #e3e1dc;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,.04);
      position: relative;
    }

    #n8n-chat {
      width: 100%;
      height: 100%;
    }

    /* MICRÓFONO */

    #voiceButton {
      position: fixed;
      right: 55px;
      bottom: 47px;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: #171817;
      color: white;
      font-size: 25px;
      cursor: pointer;
      z-index: 2147483647;
      box-shadow: 0 6px 20px rgba(0,0,0,.20);
    }

    #voiceButton.listening {
      transform: scale(1.08);
    }

    @media (max-width: 850px) {
      .sidebar {
        display: none;
      }

      .main {
        padding: 0;
      }

      .chat-shell {
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="brand">
      <div class="sol-symbol">S</div>
      <div class="brand-name">SOL</div>
      <div class="brand-subtitle">ASISTENTE PERSONAL</div>
    </div>

    <div class="menu">

      <div class="menu-item active">
        <span class="menu-icon">◫</span>
        <span>Chat</span>
      </div>

      <div class="menu-item">
        <span class="menu-icon">✓</span>
        <span>Seguimiento To Do</span>
      </div>

      <div class="menu-item">
        <span class="menu-icon">☷</span>
        <span>Seguimiento Acciones</span>
      </div>

      <div class="menu-item">
        <span class="menu-icon">✉</span>
        <span>Gestión de correos</span>
      </div>

      <div class="menu-item">
        <span class="menu-icon">▣</span>
        <span>Gestión de agenda</span>
      </div>

    </div>

    <div class="status">
      <div class="status-line">
        <span class="status-dot"></span>
        <span>Conectado</span>
      </div>
      <div class="status-sub">SOL está activo</div>
    </div>

  </aside>


  <main class="main">

    <div class="chat-shell">
      <div id="n8n-chat"></div>
    </div>

  </main>


  <button id="voiceButton" title="Hablar">🎤</button>


  <script type="module">

    import { createChat } from
      'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
      webhookUrl:
        'https://gerardopustelnik.app.n8n.cloud/webhook/ad15c930-460c-4fca-a7bf-14d9774e4105/chat',

      target: '#n8n-chat',

      mode: 'fullscreen',

      loadPreviousSession: false,

      defaultLanguage: 'es',

      initialMessages: [
        'Hola, soy SOL. ¿En qué puedo ayudarte?'
      ],

      i18n: {
        es: {
          title: 'SOL',
          subtitle: '',
          footer: '',
          getStarted: 'Nueva conversación',
          inputPlaceholder: 'Escribí o hablá con SOL...'
        }
      }
    });


    const boton = document.getElementById('voiceButton');

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      boton.disabled = true;
      boton.title = 'Este navegador no soporta reconocimiento de voz';

    } else {

      const recognition = new SpeechRecognition();

      recognition.lang = 'es-MX';
      recognition.continuous = false;
      recognition.interimResults = false;


      boton.addEventListener('click', () => {

        boton.textContent = '🔴';
        boton.classList.add('listening');

        recognition.start();

      });


      recognition.onresult = (event) => {

        const mensaje =
          event.results[0][0].transcript;

        const input = document.querySelector(
          '#n8n-chat textarea, #n8n-chat input[type="text"]'
        );

        if (!input) return;

        input.value = mensaje;

        input.dispatchEvent(
          new Event('input', { bubbles: true })
        );

        input.dispatchEvent(
          new Event('change', { bubbles: true })
        );

        setTimeout(() => {

          const enviar = document.querySelector(
            '#n8n-chat button[type="submit"]'
          );

          if (enviar) enviar.click();

        }, 300);

      };


      recognition.onend = () => {
        boton.textContent = '🎤';
        boton.classList.remove('listening');
      };


      recognition.onerror = () => {
        boton.textContent = '🎤';
        boton.classList.remove('listening');
      };

    }

  </script>

</body>
</html>
