<style>

* {

html,
body {

  height: 100%;

/* =========================================================
   VARIABLES N8N CHAT
========================================================= */

:root {

  --chat--color-primary: #11191f;
  --chat--color-primary-shade-50: #0c1419;
  --chat--color-primary-shade-100: #070b0e;

  --chat--color-secondary: #b48a49;

  --chat--color-white: #ffffff;
  --chat--color-light: #f5f5f3;
  --chat--color-light-shade-50: #eeeeeb;
  --chat--color-light-shade-100: #dfdfda;
  --chat--color-medium: #a9a9a4;
  --chat--color-dark: #171717;

  --chat--border-radius: 14px;

  --chat--window--width: 100%;
  --chat--window--height: 100%;


  /* TUS PREGUNTAS */

  --chat--message--user--background: #CFE8FF;
  --chat--message--user--color: #17324D;


  /* RESPUESTAS SINGULARITY */

  --chat--message--bot--background: #EDF6FD;
  --chat--message--bot--color: #1D3448;

}


/* =========================================================
   LAYOUT GENERAL
========================================================= */

.app {

  display: grid;

  grid-template-columns:
    118px
    minmax(0, 1fr)
    360px;

  gap: 18px;

  width: 100vw;
  height: 100vh;

  padding: 18px;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

      #11181b 0%,

  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding:
    25px
    10px
    20px;

  overflow: hidden;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.12);

}


.nav {

  width: 100%;

  display: flex;
  flex-direction: column;

  gap: 10px;

  align-items: center;

  padding-top: 8px;

}


.nav-item {

  width: 72px;
  height: 64px;

  border-radius: 17px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 23px;

  color: white;

  opacity: .88;

  transition:
    background .2s ease,
    color .2s ease;

}


.nav-item:hover {

  background:

  color: #d6b268;

}


.sidebar-bottom {

  padding-top: 18px;

  display: flex;

  justify-content: center;

}


.online-dot {

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: #58cc66;

  box-shadow:
    0 0 8px
    rgba(88,204,102,.4);

}


/* =========================================================
   CENTRO
========================================================= */

.center {

  min-width: 0;
  min-height: 0;

  height:
    calc(100vh - 36px);

}


.chat-card {

  width: 100%;
  height: 100%;

  background: white;

  border:
    1px solid #e4e4e0;

  border-radius: 28px;

  overflow: hidden;

  position: relative;

  box-shadow:
    0 8px 30px

}


/* =========================================================
   HEADER SINGULARITY
========================================================= */

.chat-brand {

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 82px;

  z-index: 50;

  align-items: center;

  pointer-events: none;

}


/* LOGO */

.singularity-logo {

  border-radius: 50%;

  align-items: center;
  justify-content: center;

  color: #b9944f;

  font-size: 24px;

  box-shadow:

}


/* SINGULARITY */

.brand-name {

  letter-spacing: 5px;

}


/* AI PERSONAL ASSISTANT */

  letter-spacing: .4px;

  color: #777;

  font-weight: 400;

/* =========================================================
   N8N CHAT
========================================================= */

  height: 100%;

  font-size: 14px;

}


/* OCULTAMOS HEADER NATIVO */

#n8n-chat .chat-header,

}


/* DEJAMOS ESPACIO PARA NUESTRO HEADER */

  height: 100% !important;

  padding-top:
    82px !important;

}


#n8n-chat .chat-wrapper {

}


/* =========================================================

========================================================= */

#n8n-chat .chat-message {

#n8n-chat p,

}


/* =========================================================
   COLORES DE LOS MENSAJES
========================================================= */


/* ---------------------------------------------------------
   PREGUNTAS DEL USUARIO

--------------------------------------------------------- */

#n8n-chat .chat-message-from-user,
#n8n-chat .chat-message.user,

/* ---------------------------------------------------------

--------------------------------------------------------- */

#n8n-chat .chat-message-from-bot,

   WIDGETS
========================================================= */

.widgets {

/* =========================================================
   CLIMA
========================================================= */

async function cargarClima() {


  try {


    const url =
      'https://api.open-meteo.com/v1/forecast?latitude=19.4326&longitude=-99.1332&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FMexico_City';


    const response =
      await fetch(url);


    const data =
      await response.json();



    document.getElementById(
      'weatherTemp'
    ).textContent =

      Math.round(
        data.current.temperature_2m
      )

      + '°C';



    document.getElementById(
      'weatherWind'
    ).textContent =

      'Viento '

      +

      Math.round(
        data.current.wind_speed_10m
      )

      +

      ' km/h';



    document.getElementById(
      'weatherMax'
    ).textContent =

      'Máx. '

      +

      Math.round(
        data.daily.temperature_2m_max[0]
      )

      +

      '°';



    document.getElementById(
      'weatherMin'
    ).textContent =

      'Mín. '

      +

      Math.round(
        data.daily.temperature_2m_min[0]
      )

      +

      '°';



    const code =
      data.current.weather_code;


    let descripcion =
      'Despejado';


    let icono =
      '☀';



    if (
      code >= 1 &&
      code <= 3
    ) {


      descripcion =
        'Parcialmente nublado';


      icono =
        '⛅';


    }


    else if (
      code >= 45 &&
      code <= 48
    ) {


      descripcion =
        'Neblina';


      icono =
        '☁';


    }


    else if (
      code >= 51
    ) {


      descripcion =
        'Lluvia';


      icono =
        '🌧';


    }



    document.getElementById(
      'weatherDescription'
    ).textContent =
      descripcion;



    document.getElementById(
      'weatherIcon'
    ).textContent =
      icono;


  }


  catch {


    document.getElementById(
      'weatherDescription'
    ).textContent =
      'Clima no disponible';


  }


}


cargarClima();

async function cargarNoticias() {


  const contenedor =
    document.getElementById(
      'news'
    );


  try {


    const feed =
      'https://news.google.com/rss?hl=es-419&gl=MX&ceid=MX:es-419';


    const url =
      'https://api.rss2json.com/v1/api.json?rss_url='
      +
      encodeURIComponent(feed);


    const response =
      await fetch(url);


    const data =
      await response.json();



    if (
      data.status !== 'ok' ||
      !data.items
    ) {

      throw new Error();

    }



    contenedor.innerHTML =
      '';



    data.items
      .slice(0,4)
      .forEach(

        item => {


          const link =
            document.createElement(
              'a'
            );


          link.className =
            'news-item';


          link.href =
            item.link;


          link.target =
            '_blank';


          link.rel =
            'noopener noreferrer';



          const fecha =
            new Date(
              item.pubDate
            );



          link.innerHTML =

            '<div class="news-title">'

            +

            item.title

            +

            '</div>'

            +

            '<div class="news-meta">'

            +

            fecha.toLocaleTimeString(
              'es-MX',
              {

                hour:
                  '2-digit',

                minute:
                  '2-digit'

              }
            )

            +

            '</div>';



          contenedor.appendChild(
            link
          );


        }

      );


  }


  catch {


    contenedor.innerHTML =

      '<div class="news-meta">Noticias no disponibles</div>';


  }


}


cargarNoticias();

async function obtenerMercado(
  mercado
) {


  const yahoo =

    'https://query1.finance.yahoo.com/v8/finance/chart/'

    +

    encodeURIComponent(
      mercado.simbolo
    )

    +

    '?range=5d&interval=1d';



  let response;



  try {


    response =
      await fetch(
        yahoo
      );


    if (!response.ok) {

      throw new Error();

    }


  }


  catch {


    const proxy =

      'https://api.allorigins.win/raw?url='

      +

      encodeURIComponent(
        yahoo
      );


    response =
      await fetch(
        proxy
      );


  }



  const data =
    await response.json();



  const resultado =
    data.chart.result[0];



  const cierres =

    resultado
      .indicators
      .quote[0]
      .close
      .filter(

        valor =>
          valor !== null

      );



  const ultimo =

    cierres[
      cierres.length - 1
    ];



  const anterior =

    cierres[
      cierres.length - 2
    ];



  const cambio =

    (
      (
        ultimo -
        anterior
      )

      /

      anterior
    )

    *

    100;



  return {

    nombre:
      mercado.nombre,

    ultimo:
      ultimo,

    cambio:
      cambio

  };


}



async function cargarMercados() {


  const contenedor =

      'markets'

  try {


    const resultados =
      await Promise.all(

        mercados.map(
          obtenerMercado

      );



    contenedor.innerHTML =
      '';



    resultados.forEach(

      mercado => {


        const fila =
          document.createElement(
            'div'
          );


        fila.className =
          'market-row';



        const clase =

          mercado.cambio >= 0

          ? 'up'

          : 'down';



        const signo =

          mercado.cambio >= 0

          ? '+'

          : '';



        fila.innerHTML =

          '<span>'

          +

          mercado.nombre

          +

          '</span>'

          +

          '<span class="market-price">'

          +

          mercado.ultimo.toLocaleString(
            'es-MX',
            {

              maximumFractionDigits:
                2

            }
          )

          +

          '</span>'

          +

          '<span class="market-change '

          +

          clase

          +

          '">'

          +

          signo

          +

          mercado.cambio.toFixed(2)

          +

          '%</span>';



        contenedor.appendChild(
          fila
        );


      }

    );


  }


  catch {


    contenedor.innerHTML =

      '<div class="news-meta">Mercados no disponibles</div>';


  }


}


cargarMercados();



/* =========================================================
   VOZ
========================================================= */

const boton =
  document.getElementById(
    'voiceButton'
  );



const SpeechRecognition =

  window.SpeechRecognition

  ||

  window.webkitSpeechRecognition;



function buscarInput() {


  return document.querySelector(

    '#n8n-chat textarea, #n8n-chat input[type="text"]'

  );


}



function buscarEnviar() {


  return document.querySelector(

    '#n8n-chat button[type="submit"]'

  );


}



if (!SpeechRecognition) {


  boton.disabled =
    true;


}


else {


  const recognition =
    new SpeechRecognition();



  recognition.lang =
    'es-MX';


  recognition.continuous =
    false;


  recognition.interimResults =
    false;



  boton.onclick =
  () => {


    boton.textContent =
      '●';


    boton.classList.add(
      'listening'
    );


    recognition.start();


  };



  recognition.onresult =
  event => {


    const mensaje =

      event.results[0][0]
      .transcript;



    const input =
      buscarInput();



    if (!input) {

      return;

    }



    input.value =
      mensaje;



    input.dispatchEvent(

      new Event(
        'input',
        {

          bubbles:
            true

        }
      )

    );



    input.dispatchEvent(

      new Event(
        'change',
        {

          bubbles:
            true

        }
      )

    );



    setTimeout(

      () => {


        const enviar =
          buscarEnviar();



        if (enviar) {


          enviar.click();


        }


        else {


          input.dispatchEvent(

            new KeyboardEvent(
              'keydown',
              {

                key:
                  'Enter',

                code:
                  'Enter',

                bubbles:
                  true

              }
            )

          );


        }


      },

      300

    );


  };



  recognition.onend =
  () => {


    boton.textContent =
      '🎤';


    boton.classList.remove(
      'listening'
    );


  };



  recognition.onerror =
    recognition.onend;


}


</script>
